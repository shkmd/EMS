services:
  app:
    environment:
      NEXT_PUBLIC_APP_URL: "https://${DOMAIN:?Set DOMAIN in .env, e.g. DOMAIN=ems.yourcompany.com}"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env, e.g. DOMAIN=ems.yourcompany.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
